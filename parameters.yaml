# =============================================
# Experiment metadata
# =============================================
experiment:
  name: "oil_spill_simulation"
  description: "Oil spill simulation for January 2006, ANHA4"
  date: "2006-01"

# =============================================
# Input data configuration
# =============================================
input_data:
  data_paths:
    U: /mnt/storage7/myers/NEMO/ANHA4-EPM520/ANHA4-EPM520_y2006m01d**_gridU.nc
    V: /mnt/storage7/myers/NEMO/ANHA4-EPM520/ANHA4-EPM520_y2006m01d**_gridV.nc
    T: /mnt/storage7/myers/NEMO/ANHA4-EPM520/ANHA4-EPM520_y2006m01d**_gridT.nc
    W: /mnt/storage7/myers/NEMO/ANHA4-EPM520/ANHA4-EPM520_y2006m01d**_gridW.nc

  ancillary_paths:
    mask: /mnt/storage4/tahya/runoff/runoff_comp_regions.nc


# =============================================
# Data transformations
# =============================================
transformations:
  interpolation:
    target_grid: T                        # Target grid for interpolation (U, V, T, or W)
    target_reference_variable: "votemper" # Reference variable for target grid dimensions
    variables:
      U:
        source_var: "vozocrtx"
        dims_mapping:
          x_grid_U: x_grid_T
      V:
        source_var: "vomecrty"
        dims_mapping:
          x_grid_V: x_grid_T
      W:
        source_var: "vovecrtz"
        dims_mapping:
          grid_W_3D_inner: deptht
  # Variable, coordinate and dimensions renaming
  renaming:
    T:
      deptht: depth
      x_grid_T: X
      y_grid_T: Y
      nav_lat_grid_T: lat
      nav_lon_grid_T: lon
      votemper: "temperature"
      vosaline: "salinity"
  attributes_to_add:
    file: 
      title: "NEMO ANHA4-EPM520 + OpenDrift"
      institution: "University of Alberta"
      source: "NEMO ocean model"
      comment: "This dataset has been processed for oil spill simulation using OpenDrift."
    variables:
      u:
        standard_name: "x_sea_water_velocity"
      v:
        standard_name: "y_sea_water_velocity"
      w:
        standard_name: "upward_sea_water_velocity"
        long_name: "Sea water z velocity"
        units: "meter second-1"
        time: "time_counter"
      depth:
        standard_name: "depth"
        long_name: "depth"
        axis: "Z"
      salinity:
        standard_name: "sea_water_salinity"

  coords_to_add:
    u: ["X", "Y"]
    v: ["X", "Y"]
    w: ["X", "Y"]
    temperature: ["X", "Y"]
    salinity: ["X", "Y"]



  # Slicing data for region of interest
  slicing:
    region_of_interest:
      Y: [530, 750]
      X: [120, 430]

  # Variables and coordinates to keep
  keep:
    variables: ["u", "v", "w", "temperature", "salinity", "sossheig", "land_binary_mask", "depth"]
    coords: ["X", "Y", "depth", "time_counter", "time_centered", "lon", "lat"]

# =============================================
# Xarray
# =============================================
xarray:
  engine: netcdf4               # Engine used for reading NetCDF
  reader:
    combine: "by_coords"       # Combine multiple files by coordinates
    data_vars: "all"           # Load all variables

# =============================================
# OpenDrift configuration
# =============================================
# Only provide parameters you want to override; all others use OpenDrift defaults.
opendrift:
  dataset:
    name: "NEMO dataset"       # Dataset name used by OpenDrift
  log_level: 0              # Logging level (0=DEBUG, 20=INFO, 30=WARNING, 40=ERROR)
  seeding:
    lat: 80           # Initial latitude of particles
    lon: 100                       # Initial longitude of particles
    number: 100                # Number of particles
    radius: 100               # Initial release radius in meters
    z: 1                        # Initial depth (0 = surface)
    # time: "2006-01-03T00:00"    # Simulation start time. Default: start time of the input data.
    oil_type: "GENERIC DIESEL"  # Type of oil

# =============================================
# Output configuration
# =============================================
output:
  directory: oil_spill/output/  # Directory to save output files
  files:
    netcdf: "oil_spill.nc"            # NetCDF result file
    plot: "oil_spill.png"             # Static plot
    animation: "oil_spill.mp4"       # Spill animation
    log: "oil_spill.log"             # Log file
